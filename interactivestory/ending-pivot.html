<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ending: pivot</title>
  <style>
    :root{--bg:#0b0b10;--text:#f2f2f7;--muted:#b9b9c6;--accent:#f7c948;--border:rgba(255,255,255,.12);}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(900px 500px at 50% 0%, rgba(247,201,72,.18), transparent 60%), var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
    .card{width:min(860px,100%);background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:18px;padding:22px;}
    h1{margin:0 0 8px;font-size:38px;}
    p{margin:0 0 14px;color:var(--muted);font-size:17px;line-height:1.5;}
    .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
    a{display:block;text-decoration:none;text-align:center;padding:14px 14px;border-radius:14px;font-weight:900;}
    .a{background:var(--accent);color:#0b0b10;}
    .b{border:1px solid var(--border);color:var(--text);}
    @media (max-width:720px){.btns{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <h1>ending b: pivot</h1>
    <p>
      the night didn’t go how you wanted. that’s not a failure. it’s information.
      you adjust, protect the long game, and move smarter next time.
    </p>
    <p>
      pivots still count when you stay intentional.
    </p>

    <div class="btns">
      <a class="a" href="choose.html">try a different path</a>
      <a class="b" href="../index.html">back to site</a>
    </div>
  </main>
</body>
</html>
